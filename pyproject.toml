[project]
name = "ecom-datalake-pipelines"
version = "0.1.0"
description = "Medallion architecture pipelines with rich silver transforms."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Garrett Schumacher"}
]
dependencies = [
  # Core data processing
  "polars>=0.20.0",
  "pyarrow>=15.0.0",

  # Configuration & validation
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pyyaml>=6.0.1",

  # File system access (local + GCS)
  "fsspec>=2024.2.0",
  "gcsfs>=2024.2.0",

  # dbt & database
  "dbt-core>=1.7.0",
  "dbt-duckdb>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]
dbt = [
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "dbt-bigquery>=1.8.0",
]

airflow = [
  "apache-airflow-providers-google>=10.15.0",
]

# All optional dependencies for full pipeline
all = [
  "ecom-datalake-pipelines[dev,airflow]",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["fsspec", "pyarrow", "pyarrow.parquet", "pyarrow.lib", "yaml"]
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.12"
ignore = [".venv", "build", "dist"]

[tool.pylint."messages control"]
disable = [
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
  "too-few-public-methods",
]

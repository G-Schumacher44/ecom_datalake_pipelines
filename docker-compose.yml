x-airflow-common: &airflow-common
  # Use custom image with pipeline dependencies baked in
  build:
    context: .
    dockerfile: Dockerfile
  image: ecom-datalake-pipeline:latest
  environment:
    # Airflow Core Config
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    PYTHONPATH: "/opt/airflow"

    # Pipeline Environment (local, dev, prod)
    PIPELINE_ENV: "${PIPELINE_ENV:-local}"
    OBSERVABILITY_ENV: "${OBSERVABILITY_ENV:-}"

    # Redirect writable paths to /tmp inside container to avoid macOS Docker volume locking (Errno 35)
    DBT_TARGET_PATH: "/tmp/dbt_target"
    DBT_LOG_PATH: "/tmp/dbt_logs"
    DBT_DUCKDB_PATH: "/tmp/dbt_duckdb/ecom.duckdb"
    METRICS_BASE_PATH: "/tmp/metrics"
    LOGS_BASE_PATH: "/tmp/logs"
    DBT_PARTIAL_PARSE: "false"

    # GCP Configuration (optional - only needed for prod/dev with GCS/BigQuery)
    GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-}"
    GCS_BUCKET: "${GCS_BUCKET:-}"
    BQ_LOCATION: "${BQ_LOCATION:-US}"
    BQ_LOAD_ENABLED: "${BQ_LOAD_ENABLED:-}"

    # Path Overrides (optional - uses config.yml defaults if not set)
    BRONZE_BASE_PATH: "${BRONZE_BASE_PATH:-samples/bronze}"
    SILVER_BASE_PATH: "${SILVER_BASE_PATH:-data/silver/base}"
    SILVER_ENRICHED_PATH: "${SILVER_ENRICHED_PATH:-data/silver/enriched}"

    # Feature Flags
    GOLD_PIPELINE_ENABLED: "${GOLD_PIPELINE_ENABLED:-false}"
    BRONZE_QA_REQUIRED: "${BRONZE_QA_REQUIRED:-true}"
    BRONZE_QA_FAIL: "${BRONZE_QA_FAIL:-false}"
    AIRFLOW_USERNAME: "${AIRFLOW_USERNAME:-airflow}"
    AIRFLOW_PASSWORD: "${AIRFLOW_PASSWORD:-airflow}"
    AIRFLOW_EMAIL: "${AIRFLOW_EMAIL:-airflow@example.com}"
    AIRFLOW_FIRSTNAME: "${AIRFLOW_FIRSTNAME:-Airflow}"
    AIRFLOW_LASTNAME: "${AIRFLOW_LASTNAME:-Admin}"

  volumes:
    # Use a named volume for logs to avoid host FS deadlocks
    - airflow-logs:/opt/airflow/logs
    # - ./airflow/plugins:/opt/airflow/plugins
    # - ./airflow/dags:/opt/airflow/dags

    # Mount data directories for local runs
    # NOTE: If you hit "Resource deadlock avoided" (Errno 35) on macOS:
    #   1. Docker Desktop → Settings → General → Change VirtioFS to gRPC FUSE
    #   2. Ensure project is NOT in a cloud-synced folder (iCloud, OneDrive, etc.)
    #   3. Restart Docker Desktop
    - ./samples:/opt/airflow/samples
    - ./data:/opt/airflow/data
    - ./docs:/opt/airflow/docs

    # Mount source code for development (optional - can remove in prod)
    # WARNING: Uncommenting dbt_duckdb causes Errno 35 on macOS Docker Desktop
    # - ./src:/opt/airflow/src
    # - ./config:/opt/airflow/config
    # - ./dbt_duckdb:/opt/airflow/dbt_duckdb
    # - ./dbt_bigquery:/opt/airflow/dbt_bigquery

  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    - postgres

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --role Admin
      --username ${AIRFLOW_USERNAME}
      --password ${AIRFLOW_PASSWORD}
      --firstname ${AIRFLOW_FIRSTNAME}
      --lastname ${AIRFLOW_LASTNAME}
      --email ${AIRFLOW_EMAIL} || true"

volumes:
  postgres-db-volume:
  airflow-logs:

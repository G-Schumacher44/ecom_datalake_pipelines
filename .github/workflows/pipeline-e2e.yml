name: Pipeline E2E

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  e2e-samples:
    runs-on: ubuntu-latest
    env:
      PIPELINE_ENV: local
      BRONZE_BASE_PATH: ${{ github.workspace }}/samples/bronze
      SILVER_BASE_PATH: ${{ github.workspace }}/data/silver/base
      SILVER_ENRICHED_PATH: ${{ github.workspace }}/data/silver/enriched
      DATE: "2025-10-15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dbt]"
      - name: Unzip Sample Data
        run: |
          cd samples
          unzip bronze_samples.zip
      - name: Setup data directories
        run: |
          mkdir -p data/silver/base/quarantine data/silver/enriched data/silver/dims data/metrics docs/validation_reports
      - name: dbt Dependencies
        run: make dbt-deps
      - name: Base Silver (dbt + Validation)
        run: |
          # Runs dbt models and contract validation
          make local-silver
      - name: dbt Data Tests (Base Silver)
        run: |
          # Specifically run dbt tests to catch DQ issues
          make dbt-test
      - name: Dimensions (dbt + Snapshot + Validation)
        run: |
          python scripts/run_dims_from_spec.py --run-date $DATE
          python -m src.validation.dims_snapshot --run-date $DATE --run-id "ci_${{ github.run_id }}"
      - name: Enriched Silver (Polars)
        run: |
          make local-enriched DATE=$DATE
      - name: Enriched Quality Gate
        run: |
          python -m src.validation.enriched --enriched-path data/silver/enriched --ingest-dt $DATE --run-id "ci_${{ github.run_id }}"
      - name: Gold Logic Pre-flight (DuckDB)
        run: |
          python scripts/test_gold_logic_on_duckdb.py

name: Pipeline E2E

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  e2e-samples:
    runs-on: ubuntu-latest
    env:
      PIPELINE_ENV: local
      BRONZE_BASE_PATH: ${{ github.workspace }}/samples/bronze
      SILVER_BASE_PATH: ${{ github.workspace }}/data/silver/base
      SILVER_DIMS_PATH: ${{ github.workspace }}/data/silver/dims
      SILVER_ENRICHED_PATH: ${{ github.workspace }}/data/silver/enriched
      DATE: "2024-01-01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dbt]"
      - name: Unzip Sample Data
        run: |
          cd samples
          unzip bronze_samples.zip
      - name: Setup data directories
        run: |
          mkdir -p data/silver/base/quarantine data/silver/enriched data/silver/dims data/metrics docs/validation_reports
      - name: dbt Dependencies
        run: make dbt-deps
      - name: Dimensions (Day 1)
        run: |
          python scripts/run_dims_from_spec.py --run-date 2024-01-01
          python -m src.validation.dims_snapshot --run-date 2024-01-01 --run-id "ci_${{ github.run_id }}"
      - name: Base Silver Day 1 (Full Load)
        run: |
          make local-silver DATE=2024-01-01
      - name: Base Silver Day 2 (Incremental)
        run: |
          make local-silver DATE=2024-01-02
      - name: Base Silver Day 3 (Incremental)
        run: |
          make local-silver DATE=2024-01-03
      - name: Verify Multi-Day Partitions
        run: |
          echo "Checking partitions exist..."
          ls -la data/silver/base/orders/ingest_dt=2024-01-0{1,2,3}
          echo "✓ All 3 days of partitions created successfully"
      - name: dbt Data Tests (Base Silver)
        run: |
          make dbt-test
      - name: Enriched Silver (Day 3)
        run: |
          make local-enriched DATE=2024-01-03
      - name: Enriched Quality Gate
        run: |
          python -m src.validation.enriched --enriched-path data/silver/enriched --ingest-dt 2024-01-03 --run-id "ci_${{ github.run_id }}"
      - name: Gold Logic Pre-flight (DuckDB)
        run: |
          python tests/integration/test_gold_logic_duckdb.py

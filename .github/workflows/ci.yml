name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Type check
        run: mypy src tests
      - name: Unit tests with coverage
        run: |
          pytest --cov=src --cov-report=term --cov-report=xml -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'pull_request'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Localized E2E Pipeline (Samples)
        env:
          PIPELINE_ENV: local
          BRONZE_BASE_PATH: ${{ github.workspace }}/samples/bronze
          SILVER_BASE_PATH: ${{ github.workspace }}/data/silver/base
          SILVER_ENRICHED_PATH: ${{ github.workspace }}/data/silver/enriched
          DATE: "2025-10-15"
        run: |
          pip install -e ".[dbt]"
          mkdir -p data/silver/base/quarantine data/silver/enriched data/silver/dims data/metrics docs/validation_reports
          
          # 1. Base Silver (dbt + Validation)
          make local-silver
          
          # 2. Dimensions (dbt + Snapshot + Validation)
          # We use our new runner and validation module
          python scripts/run_dims_from_spec.py --run-date $DATE
          python -m src.validation.dims_snapshot --run-date $DATE --run-id "ci_${{ github.run_id }}"
          
          # 3. Enriched Silver
          make local-enriched DATE=$DATE
          
          # 4. Final Enriched Quality Gate
          python -m src.validation.enriched --enriched-path data/silver/enriched --ingest-dt $DATE --run-id "ci_${{ github.run_id }}"

      - name: Validate BigQuery Models
        run: |
          cd dbt_bigquery
          dbt deps
          dbt parse



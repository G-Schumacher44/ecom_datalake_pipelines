name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Type check
        run: mypy src tests
      - name: Unit tests
        run: pytest -q
      - name: dbt validation
        run: |
          pip install -e ".[dbt]"
          export BRONZE_BASE_PATH=$(pwd)/samples/bronze
          export SILVER_BASE_PATH=$(pwd)/data/silver/base
          mkdir -p /tmp/dbt_duckdb
          cd dbt_duckdb
          dbt deps
          dbt build --target dev --project-dir . --profiles-dir .
          cd ../dbt_bigquery
          dbt deps
          dbt parse
